<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahdi Game - منصة الألعاب الشاملة</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Cairo & Orbitron) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0a0a12',
              card: '#121225',
              accent: '#8b5cf6',
              cyan: '#06b6d4',
              pink: '#ec4899',
              gold: '#eab308'
            }
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            orbitron: ['Orbitron', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #06060c;
      color: #f3f4f6;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    .neon-text-purple {
      text-shadow: 0 0 10px rgba(139, 92, 246, 0.7), 0 0 20px rgba(139, 92, 246, 0.4);
    }
    .neon-text-cyan {
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.7), 0 0 20px rgba(6, 182, 212, 0.4);
    }
    .neon-border {
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.25);
    }
    .neon-border:hover {
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.45);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a12;
    }
    ::-webkit-scrollbar-thumb {
      background: #232342;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8b5cf6;
    }
    canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#06060c] text-slate-100 font-cairo">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 bg-[#0a0a18]/90 backdrop-blur-md border-b border-purple-900/40 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="showDashboard()">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-purple-600 to-cyan-400 p-0.5 shadow-lg shadow-purple-500/30">
          <div class="w-full h-full bg-[#0d0d1a] rounded-[10px] flex items-center justify-center">
            <i class="fa-solid font-orbitron text-cyan-400 text-2xl font-bold">M</i>
          </div>
        </div>
        <div>
          <h1 class="text-2xl font-black tracking-wider font-orbitron bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
            MAHDI GAME
          </h1>
          <p class="text-xs text-cyan-400/80 tracking-widest uppercase font-semibold">منصة الألعاب الأوفلاين</p>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="flex-1 max-w-md mx-auto min-w-[240px]">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-purple-400"></i>
          <input type="text" id="searchInput" oninput="filterGames()" placeholder="ابحث عن لعبة..." 
            class="w-full bg-[#121226] text-sm text-white pl-4 pr-10 py-2.5 rounded-xl border border-purple-800/40 focus:border-cyan-400 focus:outline-none transition">
        </div>
      </div>

      <!-- Quick Info / Status -->
      <div class="hidden sm:flex items-center gap-3">
        <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          أوفلاين 100%
        </span>
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-300 text-xs font-bold">
          <i class="fa-solid fa-gamepad"></i> 20 لعبة
        </span>
      </div>

    </div>
  </header>

  <!-- Category Tabs Header -->
  <div class="bg-[#0b0b16] border-b border-purple-900/20 py-2.5 px-4 sticky top-[69px] z-30 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar">
      <button onclick="setCategory('all')" class="cat-btn active px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap bg-purple-600 text-white">
        <i class="fa-solid fa-border-all"></i> الكل (20)
      </button>
      <button onclick="setCategory('ai')" class="cat-btn px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap bg-[#16162e] text-gray-300 hover:bg-purple-900/50">
        <i class="fa-solid fa-robot text-cyan-400"></i> ضد البوت (AI)
      </button>
      <button onclick="setCategory('2p')" class="cat-btn px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap bg-[#16162e] text-gray-300 hover:bg-purple-900/50">
        <i class="fa-solid fa-user-friends text-pink-400"></i> لاعبين 2P
      </button>
      <button onclick="setCategory('arcade')" class="cat-btn px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap bg-[#16162e] text-gray-300 hover:bg-purple-900/50">
        <i class="fa-solid fa-bolt text-yellow-400"></i> فردي / أركيد
      </button>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
    
    <!-- DASHBOARD VIEW -->
    <div id="dashboardView">
      <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
        <!-- Game Cards standard JS injection -->
      </div>
      <div id="noResults" class="hidden text-center py-16">
        <i class="fa-solid fa-ghost text-5xl text-purple-500/40 mb-3"></i>
        <p class="text-gray-400 font-bold">لم يتم العثور على ألعاب مطابقة لبحثك</p>
      </div>
    </div>

    <!-- GAME PLAY CONTAINER VIEW -->
    <div id="gameView" class="hidden flex-col items-center justify-center">
      
      <!-- Top Action Bar -->
      <div class="w-full max-w-4xl flex items-center justify-between mb-4 bg-[#121226] p-3 rounded-2xl border border-purple-800/40">
        <button onclick="showDashboard()" class="px-4 py-2 bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-500 hover:to-pink-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-lg shadow-red-900/30">
          <i class="fa-solid fa-arrow-right"></i> القائمة الرئيسية
        </button>
        <div class="text-center">
          <h2 id="currentGameTitle" class="text-lg md:text-xl font-bold font-orbitron text-cyan-400">اسم اللعبة</h2>
          <span id="currentGameBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-purple-900/60 text-purple-200 border border-purple-500/30">نوع اللعبة</span>
        </div>
        <button onclick="restartCurrentGame()" class="px-3.5 py-2 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-500/40 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right"></i> إعادت اللعبة
        </button>
      </div>

      <!-- Game Stage Box -->
      <div class="w-full max-w-4xl bg-[#101021] border border-purple-500/30 rounded-2xl overflow-hidden shadow-2xl relative min-h-[480px] flex flex-col items-center justify-center p-2 sm:p-4">
        <div id="gameCanvasContainer" class="w-full h-full flex flex-col items-center justify-center relative">
          <!-- Dynamic Game Elements Injected Here -->
        </div>
      </div>

      <!-- Instructions & Mobile Controls Hint -->
      <div id="gameControlsDesc" class="w-full max-w-4xl mt-4 bg-[#121226]/60 p-4 rounded-xl border border-purple-900/30 text-xs text-gray-300 leading-relaxed flex items-center gap-3">
        <i class="fa-solid fa-circle-info text-cyan-400 text-lg"></i>
        <span id="instructionsText">تعليمات اللعب تظهر هنا...</span>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="mt-auto bg-[#070712] border-t border-purple-900/30 py-4 text-center text-xs text-gray-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p class="font-orbitron font-bold text-gray-400">MAHDI GAME &copy; 2026 - جميع الحقوق محفوظة</p>
      <p class="text-purple-400/80">منصة ألعاب بدون إنترنت | ألعاب ذكاء وتحدي</p>
    </div>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // --- GAMES DEFINITION DATABASE ---
    const GAMES = [
      { id: 'xo', title: 'إكس أو (Tic-Tac-Toe)', category: 'ai', icon: 'fa-xmark', color: 'from-purple-600 to-indigo-600', badge: 'VS AI / 2P', desc: 'لعبة X-O الشهيرة. العب ضد الذكاء الاصطناعي الذكي أو مع صديقك.' },
      { id: 'pong', title: 'بونج الكلاسيكية (Pong)', category: '2p', icon: 'fa-table-tennis-paddle-ball', color: 'from-cyan-600 to-blue-600', badge: 'VS AI / 2P', desc: 'كرة الطاولة الكلاسيكية. تحكم بخصمك واستمتع بسرعة التحدي.' },
      { id: 'connect4', title: 'أربعة على خط (Connect 4)', category: 'ai', icon: 'fa-circle-dot', color: 'from-pink-600 to-rose-600', badge: 'VS AI / 2P', desc: 'أسقط أقراصك الملونة وشكل صفاً من 4 قطع متتالية للفوز.' },
      { id: 'snake', title: 'لعبة الثعبان (Snake)', category: 'arcade', icon: 'fa-staff-snake', color: 'from-emerald-600 to-teal-600', badge: 'Arcade', desc: 'الجم ثعبانك واجمع الطعام دون الاصطدام بالجدران أو الذيل.' },
      { id: 'galaga', title: 'حرب الفضاء (Space Shooter)', category: 'arcade', icon: 'fa-shuttle-space', color: 'from-purple-600 to-pink-600', badge: 'Arcade', desc: 'دمر أسراب المركبات الفضائية المعادية واحمِ مركبتك.' },
      { id: 'memory', title: 'مطابقة الذاكرة (Memory)', category: 'arcade', icon: 'fa-brain', color: 'from-amber-600 to-orange-600', badge: 'Arcade', desc: 'اختبر قوة ذاكرتك واكتشف الأوراق المتشابهة بأقل المحاولات.' },
      { id: 'brick', title: 'تكسير الطوب (Brick Breaker)', category: 'arcade', icon: 'fa-cubes-stacked', color: 'from-blue-600 to-indigo-600', badge: 'Arcade', desc: 'وجه الكرة وحطم جدار الطوب بالكامل باستخدام المضرب.' },
      { id: 'flappy', title: 'الطائر القافز (Flappy Bird)', category: 'arcade', icon: 'fa-dove', color: 'from-yellow-500 to-emerald-600', badge: 'Arcade', desc: 'انقر للتحليق والمرور من بين الأنابيب بدون اصطدام.' },
      { id: 'reaction', title: 'اختبار سرعة رد الفعل', category: 'arcade', icon: 'fa-bolt-lightning', color: 'from-red-600 to-orange-600', badge: 'Arcade', desc: 'انتظر الإشارة الخضراء وانقر بأسرع ما لديك لقياس رد فعلك.' },
      { id: 'simon', title: 'لعبة الألوان (Simon Says)', category: 'arcade', icon: 'fa-[#0d0d1a] fa-lightbulb', color: 'from-teal-600 to-emerald-600', badge: 'Arcade', desc: 'تذكر نمط الألوان المضيئة وكرر التسلسل بشكل صحيح.' },
      { id: 'puzzle2048', title: 'لعبة 2048', category: 'arcade', icon: 'fa-border-all', color: 'from-amber-500 to-red-600', badge: 'Arcade', desc: 'ادمج الأرقام المتطابقة حتى تصل إلى المربع 2048.' },
      { id: 'rps', title: 'حجرة ورقة مقص Spock', category: 'ai', icon: 'fa-hand-back-fist', color: 'from-fuchsia-600 to-purple-600', badge: 'VS AI', desc: 'تحدى الذكاء الاصطناعي في النسخة المباشرة والسريعة.' },
      { id: 'whack', title: 'صيد الأهداف (Whack Mole)', category: 'arcade', icon: 'fa-bullseye', color: 'from-green-600 to-emerald-600', badge: 'Arcade', desc: 'اضغط على الأهداف الظاهرة بأسرع سرعة قبل اختفائها.' },
      { id: 'dino', title: 'الركض والقفز (Dino Jump)', category: 'arcade', icon: 'fa-person-running', color: 'from-cyan-600 to-teal-600', badge: 'Arcade', desc: 'اقفز فوق العقبات في الوقت المناسب وواصل الجري.' },
      { id: 'penalty', title: 'ركلات الترجيح (Penalty)', category: 'ai', icon: 'fa-futbol', color: 'from-emerald-600 to-green-700', badge: 'VS AI', desc: 'سدد الكرة على المرمى وتغلب على حارس المرمى الذكي.' },
      { id: 'colorswitch', title: 'تفادي الألوان (Color Dodge)', category: 'arcade', icon: 'fa-palette', color: 'from-purple-600 to-pink-500', badge: 'Arcade', desc: 'تحكم بالكرة وتفادى العوائق التي تختلف عن لونك.' },
      { id: 'aim', title: 'تدريب التصويب (Aim Trainer)', category: 'arcade', icon: 'fa-crosshair', color: 'from-red-600 to-rose-600', badge: 'Arcade', desc: 'دمر الدوائر المتساقطة لزيادة دقة وسرعة تصويبك.' },
      { id: 'math', title: 'تحدي الحساب السريع', category: 'arcade', icon: 'fa-calculator', color: 'from-indigo-600 to-blue-600', badge: 'Arcade', desc: 'حل أكبر عدد من المسائل الرياضية قبل انتهاء الوقت.' },
      { id: 'xo4', title: 'إكس أو العملاقة 4x4', category: 'ai', icon: 'fa-table-cells', color: 'from-violet-600 to-purple-800', badge: 'VS AI / 2P', desc: 'تحدي استراتيجي موسع في شبكة 4x4 لتوصيل 4 علامات.' },
      { id: 'car', title: 'سباق السيارات (Dodge Cars)', category: 'arcade', icon: 'fa-car-side', color: 'from-rose-600 to-red-600', badge: 'Arcade', desc: 'قد سيارتك وتفادى السيارات الآتية في الطريق السريع.' }
    ];

    let currentCategory = 'all';
    let currentGameId = null;
    let activeGameLoop = null;

    // --- INITIALIZATION ---
    window.onload = () => {
      renderGamesList();
    };

    function renderGamesList() {
      const grid = document.getElementById('gamesGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';
      let count = 0;

      GAMES.forEach(game => {
        const matchesCategory = (currentCategory === 'all') || 
                                (currentCategory === 'ai' && game.category === 'ai') ||
                                (currentCategory === '2p' && (game.category === '2p' || game.badge.includes('2P'))) ||
                                (currentCategory === 'arcade' && game.category === 'arcade');

        const matchesSearch = game.title.toLowerCase().includes(searchVal) || game.desc.toLowerCase().includes(searchVal);

        if (matchesCategory && matchesSearch) {
          count++;
          const card = document.createElement('div');
          card.className = "bg-[#111124] border border-purple-900/30 rounded-2xl overflow-hidden hover:border-cyan-400/60 transition-all duration-300 hover:-translate-y-1.5 flex flex-col justify-between shadow-lg group neon-border";
          
          card.innerHTML = `
            <div class="p-5">
              <div class="flex items-start justify-between gap-2 mb-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr ${game.color} flex items-center justify-center text-white text-xl shadow-md">
                  <i class="fa-solid ${game.icon}"></i>
                </div>
                <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-purple-950 text-cyan-300 border border-purple-800/50">
                  ${game.badge}
                </span>
              </div>
              <h3 class="font-bold text-base text-gray-100 group-hover:text-cyan-400 transition-colors mb-1 font-orbitron">${game.title}</h3>
              <p class="text-xs text-gray-400 leading-relaxed line-clamp-2">${game.desc}</p>
            </div>
            <div class="p-4 pt-0">
              <button onclick="launchGame('${game.id}')" class="w-full py-2.5 bg-gradient-to-r from-purple-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 shadow-md">
                <i class="fa-solid fa-play"></i> ابدأ اللعب
              </button>
            </div>
          `;
          grid.appendChild(card);
        }
      });

      document.getElementById('noResults').classList.toggle('hidden', count > 0);
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-purple-600', 'text-white');
        btn.classList.add('bg-[#16162e]', 'text-gray-300');
      });
      event.currentTarget.classList.remove('bg-[#16162e]', 'text-gray-300');
      event.currentTarget.classList.add('bg-purple-600', 'text-white');
      renderGamesList();
    }

    function filterGames() {
      renderGamesList();
    }

    function showDashboard() {
      if (activeGameLoop) clearInterval(activeGameLoop);
      document.getElementById('gameView').classList.add('hidden');
      document.getElementById('gameView').classList.remove('flex');
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('gameCanvasContainer').innerHTML = '';
      currentGameId = null;
    }

    function launchGame(id) {
      if (activeGameLoop) clearInterval(activeGameLoop);
      const game = GAMES.find(g => g.id === id);
      if (!game) return;

      currentGameId = id;
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('gameView').classList.remove('hidden');
      document.getElementById('gameView').classList.add('flex');
      document.getElementById('currentGameTitle').innerText = game.title;
      document.getElementById('currentGameBadge').innerText = game.badge;

      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = ''; // reset

      // Launch corresponding engine
      switch (id) {
        case 'xo': initXO(container, 3); break;
        case 'xo4': initXO(container, 4); break;
        case 'pong': initPong(container); break;
        case 'connect4': initConnect4(container); break;
        case 'snake': initSnake(container); break;
        case 'galaga': initGalaga(container); break;
        case 'memory': initMemory(container); break;
        case 'brick': initBrick(container); break;
        case 'flappy': initFlappy(container); break;
        case 'reaction': initReaction(container); break;
        case 'simon': initSimon(container); break;
        case 'puzzle2048': init2048(container); break;
        case 'rps': initRPS(container); break;
        case 'whack': initWhack(container); break;
        case 'dino': initDino(container); break;
        case 'penalty': initPenalty(container); break;
        case 'colorswitch': initColorSwitch(container); break;
        case 'aim': initAimTrainer(container); break;
        case 'math': initMath(container); break;
        case 'car': initCarRace(container); break;
        default: container.innerHTML = '<p class="text-red-400 font-bold">اللعبة قيد التطوير!</p>';
      }
    }

    function restartCurrentGame() {
      if (currentGameId) launchGame(currentGameId);
    }


    // =========================================================================
    // 1. GAME 1 & 19: TIC TAC TOE (3x3 & 4x4)
    // =========================================================================
    function initXO(container, size = 3) {
      document.getElementById('instructionsText').innerText = `انقر على المربعات لوضع علامتك. نمط 1 Player يعتمد على الذكاء الاصطناعي، ويمكن التبديل لنمط لاعبين 2P.`;
      let mode = 'ai'; // 'ai' or '2p'
      let board = Array(size * size).fill(null);
      let turn = 'X';
      let gameOver = false;

      const wrapper = document.createElement('div');
      wrapper.className = 'flex flex-col items-center gap-4 w-full max-w-sm';
      
      wrapper.innerHTML = `
        <div class="flex gap-2 mb-2">
          <button id="xoAiBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-cyan-600 text-white">ضد البوت AI</button>
          <button id="xo2pBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-800 text-gray-300">لاعبين 2P</button>
        </div>
        <div id="xoStatus" class="text-sm font-bold text-purple-300">دور اللاعب: X</div>
        <div id="xoGrid" class="grid grid-cols-${size} gap-2 w-full aspect-square bg-[#1a1a36] p-3 rounded-2xl border border-purple-800/50"></div>
      `;
      container.appendChild(wrapper);

      const statusEl = wrapper.querySelector('#xoStatus');
      const gridEl = wrapper.querySelector('#xoGrid');
      gridEl.style.gridTemplateColumns = `repeat(${size}, minmax(0, 1fr))`;

      wrapper.querySelector('#xoAiBtn').onclick = () => { mode = 'ai'; resetXO(); };
      wrapper.querySelector('#xo2pBtn').onclick = () => { mode = '2p'; resetXO(); };

      function renderGrid() {
        gridEl.innerHTML = '';
        board.forEach((cell, idx) => {
          const btn = document.createElement('button');
          btn.className = `w-full h-full text-2xl sm:text-3xl font-black rounded-xl border border-purple-800/40 bg-[#121226] hover:bg-purple-900/30 flex items-center justify-center transition ${cell === 'X' ? 'text-cyan-400' : 'text-pink-400'}`;
          btn.innerText = cell || '';
          btn.onclick = () => handleMove(idx);
          gridEl.appendChild(btn);
        });
      }

      function handleMove(idx) {
        if (board[idx] || gameOver) return;
        board[idx] = turn;
        renderGrid();

        if (checkWin(board, turn, size)) {
          statusEl.innerText = `الفائز هو اللاعب ${turn}! 🎉`;
          gameOver = true;
          return;
        }

        if (board.every(c => c !== null)) {
          statusEl.innerText = `تعادل! 🤝`;
          gameOver = true;
          return;
        }

        turn = turn === 'X' ? 'O' : 'X';
        statusEl.innerText = `دور اللاعب: ${turn}`;

        if (mode === 'ai' && turn === 'O' && !gameOver) {
          setTimeout(aiMove, 300);
        }
      }

      function aiMove() {
        let emptyIndices = board.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
        if (emptyIndices.length === 0 || gameOver) return;
        
        // Simple Smart AI check
        let chosen = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        handleMove(chosen);
      }

      function checkWin(b, p, s) {
        // Rows & Cols
        for (let i = 0; i < s; i++) {
          let rowWin = true, colWin = true;
          for (let j = 0; j < s; j++) {
            if (b[i * s + j] !== p) rowWin = false;
            if (b[j * s + i] !== p) colWin = false;
          }
          if (rowWin || colWin) return true;
        }
        // Diagonals
        let diag1 = true, diag2 = true;
        for (let i = 0; i < s; i++) {
          if (b[i * s + i] !== p) diag1 = false;
          if (b[i * s + (s - 1 - i)] !== p) diag2 = false;
        }
        return diag1 || diag2;
      }

      function resetXO() {
        board = Array(size * size).fill(null);
        turn = 'X';
        gameOver = false;
        statusEl.innerText = `دور اللاعب: X`;
        renderGrid();
      }

      renderGrid();
    }

    // 2. GAME 2: PONG / AIR HOCKEY

    function initPong(container) {
      document.getElementById('instructionsText').innerText = `اللاعب 1: مفاتيح W/S أو اللمس. اللاعب 2 / AI: أسهم الأسرار Up/Down.`;
      
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 360;
      canvas.className = "w-full max-w-xl rounded-xl border border-purple-800 bg-[#080814] shadow-lg";
      container.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let paddleH = 70, paddleW = 10;
      let p1Y = (canvas.height - paddleH) / 2;
      let p2Y = (canvas.height - paddleH) / 2;
      let ballX = canvas.width / 2, ballY = canvas.height / 2;
      let ballSpeedX = 4, ballSpeedY = 3;
      let p1Score = 0, p2Score = 0;
      let keys = {};

      window.onkeydown = e => keys[e.key] = true;
      window.onkeyup = e => keys[e.key] = false;

      // Mobile touch support
      canvas.addEventListener('touchmove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const touchY = e.touches[0].clientY - rect.top;
        p1Y = touchY - paddleH / 2;
      });

      activeGameLoop = setInterval(() => {
        // Move P1
        if (keys['w'] || keys['W']) p1Y = Math.max(0, p1Y - 5);
        if (keys['s'] || keys['S']) p1Y = Math.min(canvas.height - paddleH, p1Y + 5);

        // Move P2 (AI)
        if (ballY > p2Y + paddleH / 2) p2Y = Math.min(canvas.height - paddleH, p2Y + 3.8);
        else p2Y = Math.max(0, p2Y - 3.8);

        // Move Ball
        ballX += ballSpeedX;
        ballY += ballSpeedY;

        // Wall collisions
        if (ballY <= 0 || ballY >= canvas.height) ballSpeedY = -ballSpeedY;

        // Paddle collisions
        if (ballX <= paddleW + 10 && ballY >= p1Y && ballY <= p1Y + paddleH) {
          ballSpeedX = -ballSpeedX * 1.05;
        }
        if (ballX >= canvas.width - paddleW - 10 && ballY >= p2Y && ballY <= p2Y + paddleH) {
          ballSpeedX = -ballSpeedX * 1.05;
        }

        // Score
        if (ballX < 0) { p2Score++; resetBall(); }
        if (ballX > canvas.width) { p1Score++; resetBall(); }

        // Draw
        ctx.fillStyle = '#080814';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Net
        ctx.strokeStyle = '#222244';
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();

        // Paddles
        ctx.fillStyle = '#06b6d4'; // P1 Cyan
        ctx.fillRect(10, p1Y, paddleW, paddleH);
        ctx.fillStyle = '#ec4899'; // P2 Pink
        ctx.fillRect(canvas.width - paddleW - 10, p2Y, paddleW, paddleH);

        // Ball
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ballX, ballY, 7, 0, Math.PI * 2);
        ctx.fill();

        // Scores
        ctx.font = '20px Orbitron';
        ctx.fillText(p1Score, canvas.width / 4, 35);
        ctx.fillText(p2Score, (3 * canvas.width) / 4, 35);

      }, 1000 / 60);

      function resetBall() {
        ballX = canvas.width / 2;
        ballY = canvas.height / 2;
        ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * 4;
        ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * 3;
      }
    }

    // 3. GAME 3: CONNECT 4
    // =========================================================================
    function initConnect4(container) {
      document.getElementById('instructionsText').innerText = `انقر على العمود لأسقاط القرص الخاص بك. شكل 4 أقراص متتالية أفقياً أو عمودياً أو قطرياً.`;
      
      const ROWS = 6, COLS = 7;
      let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      let turn = 1; // 1: Red (Player), 2: Yellow (AI)
      let gameOver = false;

      const wrapper = document.createElement('div');
      wrapper.className = "flex flex-col items-center gap-3";
      wrapper.innerHTML = `
        <div id="c4Status" class="text-sm font-bold text-cyan-400">دور اللاعب (الأحمر)</div>
        <div id="c4Board" class="grid grid-cols-7 gap-1.5 bg-[#181836] p-3 rounded-2xl border border-purple-800"></div>
      `;
      container.appendChild(wrapper);

      const boardEl = wrapper.querySelector('#c4Board');
      const statusEl = wrapper.querySelector('#c4Status');

      function render() {
        boardEl.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            const val = grid[r][c];
            cell.className = `w-10 h-10 sm:w-12 sm:h-12 rounded-full cursor-pointer transition flex items-center justify-center ${val === 0 ? 'bg-[#0a0a1a]' : val === 1 ? 'bg-rose-500 shadow-md shadow-rose-500/50' : 'bg-amber-400 shadow-md shadow-amber-400/50'}`;
            cell.onclick = () => dropDisc(c);
            boardEl.appendChild(cell);
          }
        }
      }

      function dropDisc(c) {
        if (gameOver) return;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r][c] === 0) {
            grid[r][c] = turn;
            render();
            if (checkWin(r, c)) {
              statusEl.innerText = `🎉 الفائز هو ${turn === 1 ? 'اللاعب الأحمر' : 'البوت الأصفر'}!`;
              gameOver = true;
              return;
            }
            turn = turn === 1 ? 2 : 1;
            statusEl.innerText = turn === 1 ? 'دور اللاعب (الأحمر)' : 'دور البوت (الأصفر)...';
            
            if (turn === 2 && !gameOver) {
              setTimeout(aiDrop, 400);
            }
            return;
          }
        }
      }

      function aiDrop() {
        let validCols = [];
        for (let c = 0; c < COLS; c++) {
          if (grid[0][c] === 0) validCols.push(c);
        }
        if (validCols.length > 0) {
          let chosen = validCols[Math.floor(Math.random() * validCols.length)];
          dropDisc(chosen);
        }
      }

      function checkWin(r, c) {
        const val = grid[r][c];
        const count = (dx, dy) => {
          let cnt = 0, x = r + dx, y = c + dy;
          while (x >= 0 && x < ROWS && y >= 0 && y < COLS && grid[x][y] === val) {
            cnt++; x += dx; y += dy;
          }
          return cnt;
        };
        return (count(1,0)+count(-1,0)>=3) || (count(0,1)+count(0,-1)>=3) || (count(1,1)+count(-1,-1)>=3) || (count(1,-1)+count(-1,1)>=3);
      }

      render();
    }

      grid.innerHTML = `
        <button id="btn-red" class="bg-red-600 rounded-2xl opacity-70 hover:opacity-100 transition active:scale-95"></button>
        <button id="btn-green" class="bg-green-600 rounded-2xl opacity-70 hover:opacity-100 transition active:scale-95"></button>
        <button id="btn-blue" class="bg-blue-600 rounded-2xl opacity-70 hover:opacity-100 transition active:scale-95"></button>
        <button id="btn-yellow" class="bg-yellow-500 rounded-2xl opacity-70 hover:opacity-100 transition active:scale-95"></button>
      `;
      container.appendChild(grid);

      function nextRound() {
        playerSeq = [];
        sequence.push(colors[Math.floor(Math.random() * 4)]);
        playSequence();
      }

      function playSequence() {
        let idx = 0;
        let interval = setInterval(() => {
          flashColor(sequence[idx]);
          idx++;
          if (idx >= sequence.length) clearInterval(interval);
        }, 600);
      }

      function flashColor(col) {
        const btn = grid.querySelector(`#btn-${col}`);
        btn.classList.add('brightness-200', 'scale-105');
        setTimeout(() => btn.classList.remove('brightness-200', 'scale-105'), 300);
      }

      colors.forEach(col => {
        grid.querySelector(`#btn-${col}`).onclick = () => {
          flashColor(col);
          playerSeq.push(col);
          if (playerSeq[playerSeq.length - 1] !== sequence[playerSeq.length - 1]) {
            alert('خطأ في التسلسل! أعد المحاولة.');
            sequence = [];
            nextRound();
          } else if (playerSeq.length === sequence.length) {
            setTimeout(nextRound, 800);
          }
        };
      });

      nextRound();
    }


    // =========================================================================
    // 11. GAME 11: 2048 PUZZLE
    // =========================================================================
    function init2048(container) {
      document.getElementById('instructionsText').innerText = `استخدم أسهم الكيبورد لدمج الأرقام المتشابهة للحصول على 2048.`;
      
      let grid = Array(4).fill(null).map(() => Array(4).fill(0));
      
      const wrapper = document.createElement('div');
      wrapper.className = "grid grid-cols-4 gap-2 bg-[#181836] p-3 rounded-2xl border border-purple-800 w-72 h-72";
      container.appendChild(wrapper);

      function addNumber() {
        let empty = [];
        for (let r=0; r<4; r++)
          for (let c=0; c<4; c++)
            if (grid[r][c] === 0) empty.push({r, c});
        if (empty.length > 0) {
          let spot = empty[Math.floor(Math.random() * empty.length)];
          grid[spot.r][spot.c] = Math.random() > 0.1 ? 2 : 4;
        }
      }

      function render() {
        wrapper.innerHTML = '';
        for (let r=0; r<4; r++) {
          for (let c=0; c<4; c++) {
            let val = grid[r][c];
            let cell = document.createElement('div');
            cell.className = `w-full h-full rounded-xl flex items-center justify-center font-bold text-lg font-orbitron ${val===0?'bg-[#0a0a1a]':val===2?'bg-purple-900 text-white':val===4?'bg-indigo-700 text-white':val===8?'bg-cyan-600 text-white':'bg-pink-600 text-white'}`;
            cell.innerText = val > 0 ? val : '';
            wrapper.appendChild(cell);
          }
        }
      }

      window.onkeydown = e => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
          addNumber();
          render();
        }
      };

      addNumber(); addNumber(); render();
    }


    // =========================================================================
    // 12. GAME 12: ROCK PAPER SCISSORS SPOCK
    // =========================================================================
    function initRPS(container) {
      document.getElementById('instructionsText').innerText = `اختر حركتك لمواجهة الذكاء الاصطناعي.`;
      
      const choices = ['حجرة ✊', 'ورقة ✋', 'مقص ✌️'];
      const wrapper = document.createElement('div');
      wrapper.className = "flex flex-col items-center gap-4 text-center";
      wrapper.innerHTML = `
        <div id="rpsResult" class="text-xl font-bold text-cyan-400">اختر حركتك!</div>
        <div class="flex gap-3">
          <button onclick="playRPS(0)" class="px-4 py-3 bg-[#1a1a36] hover:bg-purple-800 rounded-xl font-bold border border-purple-700">✊ حجرة</button>
          <button onclick="playRPS(1)" class="px-4 py-3 bg-[#1a1a36] hover:bg-purple-800 rounded-xl font-bold border border-purple-700">✋ ورقة</button>
          <button onclick="playRPS(2)" class="px-4 py-3 bg-[#1a1a36] hover:bg-purple-800 rounded-xl font-bold border border-purple-700">✌️ مقص</button>
        </div>
      `;
      container.appendChild(wrapper);

      window.playRPS = (userChoice) => {
        const aiChoice = Math.floor(Math.random() * 3);
        const resEl = wrapper.querySelector('#rpsResult');
        if (userChoice === aiChoice) {
          resEl.innerText = `تعادل! كلاكما اختار ${choices[userChoice]}`;
        } else if ((userChoice === 0 && aiChoice === 2) || (userChoice === 1 && aiChoice === 0) || (userChoice === 2 && aiChoice === 1)) {
          resEl.innerText = `فوز رائع! 🎉 اخترت ${choices[userChoice]} والبوت ${choices[aiChoice]}`;
        } else {
          resEl.innerText = `خسارة! 😅 اخترت ${choices[userChoice]} والبوت ${choices[aiChoice]}`;
        }
      };
    }


    // =========================================================================
    // 13. GAME 13: WHACK A MOLE
    // =========================================================================
    function initWhack(container) {
      document.getElementById('instructionsText').innerText = `اصطاد الأهداف الظاهرة بلمسها بأسرع سرعة لجمع النقاط.`;
      
      let score = 0;
      const wrapper = document.createElement('div');
      wrapper.className = "flex flex-col items-center gap-3";
      wrapper.innerHTML = `
        <div class="text-sm font-bold text-cyan-400">النقاط: <span id="moleScore">0</span></div>
        <div class="grid grid-cols-3 gap-3 w-64 h-64 bg-[#14142b] p-3 rounded-2xl border border-purple-800" id="moleGrid"></div>
      `;
      container.appendChild(wrapper);

      const grid = wrapper.querySelector('#moleGrid');
      for (let i = 0; i < 9; i++) {
        const btn = document.createElement('button');
        btn.className = "w-full h-full bg-[#0a0a1a] rounded-xl text-3xl flex items-center justify-center transition";
        grid.appendChild(btn);
      }

      activeGameLoop = setInterval(() => {
        const buttons = grid.querySelectorAll('button');
        buttons.forEach(b => { b.innerText = ''; b.onclick = null; });
        const rand = Math.floor(Math.random() * 9);
        buttons[rand].innerText = '🎯';
        buttons[rand].onclick = () => {
          score += 10;
          wrapper.querySelector('#moleScore').innerText = score;
          buttons[rand].innerText = '💥';
        };
      }, 700);
    }


    // =========================================================================
    // 14. GAME 14: ENDLESS RUNNER (DINO JUMP)
    // =========================================================================
    function initDino(container) {
      document.getElementById('instructionsText').innerText = `انقر بالشاشة أو اضغط سهم الأعلى للقفز وتفادي العقبات.`;
      
      const canvas = document.createElement('canvas');
      canvas.width = 420;
      canvas.height = 200;
      canvas.className = "rounded-xl border border-purple-800 bg-[#070714]";
      container.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let runnerY = 140, dy = 0, isJumping = false;
      let obstacles = [];
      let score = 0;

      const jump = () => {
        if (!isJumping) { dy = -9; isJumping = true; }
      };
      canvas.onclick = jump;
      window.onkeydown = e => { if (e.code==='ArrowUp'||e.code==='Space') jump(); };

      activeGameLoop = setInterval(() => {
        dy += 0.45;
        runnerY += dy;
        if (runnerY >= 140) { runnerY = 140; dy = 0; isJumping = false; }

        if (Math.random() < 0.02) obstacles.push({x: canvas.width, w: 15, h: 25});

        ctx.fillStyle = '#070714';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // Ground
        ctx.strokeStyle = '#333366';
        ctx.beginPath(); ctx.moveTo(0, 165); ctx.lineTo(canvas.width, 165); ctx.stroke();

        // Runner
        ctx.fillStyle = '#06b6d4';
        ctx.fillRect(40, runnerY, 20, 25);

        // Obstacles
        obstacles.forEach((o, idx) => {
          o.x -= 4;
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(o.x, 140, o.w, o.h);

          // Collision
          if (40 < o.x + o.w && 60 > o.x && runnerY + 25 > 140) {
            alert(`Game Over! النتيجة: ${score}`);
            obstacles = []; score = 0;
          }
        });

        score++;
        ctx.fillStyle = '#fff';
        ctx.font = '12px Orbitron';
        ctx.fillText(`المسافة: ${score}`, 10, 20);

      }, 1000/60);
    }


    // =========================================================================
    // 15. GAME 15: PENALTY SHOOTOUT
    // =========================================================================
    function initPenalty(container) {
      document.getElementById('instructionsText').innerText = `انقر في المرمى لتسديد الكرة والتغلب على الحارس.`;
      
      const canvas = document.createElement('canvas');
      canvas.width = 380;
      canvas.height = 300;
      canvas.className = "rounded-xl border border-purple-800 bg-[#0a1a0a]";
      container.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let keeperX = 170;
      let score = 0;

      canvas.onclick = e => {
        let rect = canvas.getBoundingClientRect();
        let shotX = e.clientX - rect.left;
        let shotY = e.clientY - rect.top;

        if (shotY < 120) { // Goal area
          let keeperCaught = Math.abs(shotX - keeperX) < 40;
          if (keeperCaught) {
            alert('صدها الحارس! 🧤');
          } else {
            score++;
            alert('هدف رائع! ⚽🎉');
          }
        }
      };

      activeGameLoop = setInterval(() => {
        keeperX += (Math.random() - 0.5) * 8;
        keeperX = Math.max(80, Math.min(260, keeperX));

        ctx.fillStyle = '#0a200a';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // Goal Frame
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.strokeRect(60, 20, 260, 100);

        // Goalkeeper
        ctx.fillStyle = '#eab308';
        ctx.fillRect(keeperX - 20, 70, 40, 50);

        // Ball
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(190, 250, 10, 0, Math.PI*2); ctx.fill();

        ctx.font = '14px Orbitron';
        ctx.fillText(`الأهداف: ${score}`, 15, 290);
      }, 1000/30);
    }


    // =========================================================================
    // 16. GAME 16: COLOR DODGE
    // =========================================================================
    function initColorSwitch(container) {
      document.getElementById('instructionsText').innerText = `حرك الكرات يميناً ويساراً لتفادي الأشكال غير المطابقة.`;
      
      const canvas = document.createElement('canvas');
      canvas.width = 320; canvas.height = 360;
      canvas.className = "rounded-xl border border-purple-800 bg-[#0a0a18]";
      container.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let px = 150;
      canvas.onmousemove = e => { px = e.clientX - canvas.getBoundingClientRect().left; };

      activeGameLoop = setInterval(() => {
        ctx.fillStyle = '#0a0a18';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle = '#06b6d4';
        ctx.beginPath(); ctx.arc(px, 320, 12, 0, Math.PI*2); ctx.fill();
      }, 1000/60);
    }


    // =========================================================================
    // 17. GAME 17: AIM TRAINER
    // =========================================================================
    function initAimTrainer(container) {
      document.getElementById('instructionsText').innerText = `انقر الأهداف الحمراء بأسرع وقت لزيادة الدقة والسرعة.`;
      
      let hits = 0;
      const box = document.createElement('div');
      box.className = "w-full max-w-sm h-72 bg-[#101026] rounded-2xl border border-purple-800 relative overflow-hidden";
      container.appendChild(box);

      function spawnTarget() {
        box.innerHTML = `<div class="absolute text-xs text-cyan-400 top-2 right-2">الأهداف: ${hits}</div>`;
        const target = document.createElement('div');
        const size = Math.floor(Math.random() * 20) + 30;
        target.style.width = `${size}px`;
        target.style.height = `${size}px`;
        target.style.left = `${Math.random() * 80}%`;
        target.style.top = `${Math.random() * 80}%`;
        target.className = "absolute bg-rose-500 rounded-full cursor-pointer animate-ping border-2 border-white";
        target.onclick = () => { hits++; spawnTarget(); };
        box.appendChild(target);
      }

      spawnTarget();
    }


    // =========================================================================
    // 18. GAME 18: MATH SPEED CHALLENGE
    // =========================================================================
    function initMath(container) {
      document.getElementById('instructionsText').innerText = `حل المسائل الرياضية بسرعة قبل انتهاء الوقت.`;
      
      let score = 0;
      const wrapper = document.createElement('div');
      wrapper.className = "flex flex-col items-center gap-4 text-center";
      container.appendChild(wrapper);

      function newQuestion() {
        let n1 = Math.floor(Math.random() * 12) + 1;
        let n2 = Math.floor(Math.random() * 12) + 1;
        let ans = n1 + n2;

        wrapper.innerHTML = `
          <div class="text-sm text-cyan-400 font-bold">النقاط: ${score}</div>
          <div class="text-3xl font-black font-orbitron">${n1} + ${n2} = ?</div>
          <div class="flex gap-2">
            <button onclick="checkMath(${ans})" class="px-4 py-2 bg-purple-700 rounded-xl font-bold">${ans}</button>
            <button onclick="checkMath(${ans + 3})" class="px-4 py-2 bg-purple-700 rounded-xl font-bold">${ans + 3}</button>
            <button onclick="checkMath(${ans - 2})" class="px-4 py-2 bg-purple-700 rounded-xl font-bold">${ans - 2}</button>
          </div>
        `;
      }

      window.checkMath = (val) => {
        score++;
        newQuestion();
      };

      newQuestion();
    }


    // =========================================================================
    // 20. GAME 20: HIGHWAY CAR RACE
    // =========================================================================
    function initCarRace(container) {
      document.getElementById('instructionsText').innerText = `حرك سيارتك لتفادي حركة المرور في الطريق السريع.`;
      
      const canvas = document.createElement('canvas');
      canvas.width = 320; canvas.height = 400;
      canvas.className = "rounded-xl border border-purple-800 bg-[#111]";
      container.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let carX = 140;
      let enemies = [];

      canvas.onmousemove = e => {
        let rect = canvas.getBoundingClientRect();
        carX = e.clientX - rect.left - 15;
      };

      activeGameLoop = setInterval(() => {
        if (Math.random() < 0.03) enemies.push({x: Math.random()*280, y: -40});

        ctx.fillStyle = '#111';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // Player Car
        ctx.fillStyle = '#06b6d4';
        ctx.fillRect(carX, 320, 30, 50);

        // Enemy Cars
        enemies.forEach(e => {
          e.y += 4;
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(e.x, e.y, 30, 50);
        });

      }, 1000/60);
    }

  </script>
</body>
